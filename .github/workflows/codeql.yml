name: CodeQL

# Static analysis, on the schedule as well as on pushes: a rule added upstream can find something
# in code that has not changed since.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # The bench's task fixtures are exercises handed to the model — some are broken on purpose
          # (an injection to fix, a slow regex to find) — not code this product runs. Their checks
          # and helpers outside `files/`, `solution/` and `hidden/` stay analysed.
          config: |
            paths-ignore:
              - eval/tasks/*/files/**
              - eval/tasks/*/solution/**
              - eval/tasks/*/hidden/**
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
