name: Model catalogue

# Keeps prices and model ids current without anyone editing them by hand. The rule this enforces:
# no version and no price is ever hard-coded in the source — the file it writes is generated, and
# the workflow commits the diff when a provider changes something.

on:
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # The selection rules are in `src/core/router/curate.ts` with their tests, and this script
      # imports the built bundle. That costs an install and a build on a daily job, and it is less
      # than the cost of a rule nobody can test: the recency term was a rounding error for months
      # while the file it wrote claimed recency in its header (ADR-0027).
      - run: npm ci
      - run: npm run build
      - run: node scripts/update-models.mjs
      - name: Commit when something moved
        run: |
          # Two generated files, one job: the price catalogue, and the Hivey presets curated from it.
          FILES="src/core/router/catalog.generated.ts src/core/router/hivey.generated.ts"
          if [[ -n "$(git status --porcelain $FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore(models): refresh the catalogue and the Hivey presets"
            git push
          else
            echo "No change today."
          fi
